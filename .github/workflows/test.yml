# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'mcp/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, lifepilot-integration]
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'mcp/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:24.22.1-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm run check:production-imports
        working-directory: api

  api-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API production image
        run: docker build -f api/Dockerfile -t opengym-api:ci .
      - name: Smoke production module graph
        run: docker run --rm opengym-api:ci node --input-type=module -e "import { validateFullV2SessionPrescription } from './integrations/lifepilot-prescription-v2.js'; console.log(typeof validateFullV2SessionPrescription)"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp
